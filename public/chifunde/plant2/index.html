    const c = document.createElement("canvas"); c.width = c.height = size;
    const g = c.getContext("2d"); draw(g, size);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;

  const f = v => v === undefined || v === null ? "" : v; let h = `<b>${f(d.tag)}</b> — ${f(d.vn)}<br>`;
  if (d.kind === "conveyor") h += `Băng ${d.belt} · dài ${d.L.toFixed(1)} m · nâng ${d.lift.toFixed(2)} m · góc ${d.ang.toFixed(1)}° · động cơ ${d.kw} kW<br>Đuôi (${d.tail[0]}, ${d.tail[1]}, +${d.tail[2]}) → đầu (${d.head[0]}, ${d.head[1]}, +${d.head[2]}) m`;
  else { h += `Model: ${f(d.model)}<br>`; if (d.kw) h += `Động cơ: ${d.kw} kW · `; if (d.mass) h += `Khối lượng ≈ ${d.mass} t`; h += `<br>Kích thước bao ≈ ${d.dims[0]} × ${d.dims[1]} × ${d.dims[2]} m (D×R×C)`;
    h += `<br>Vị trí (X, Y, Z) = (${d.pos[0]}, ${d.pos[1]}, ${d.pos[2] >= 0 ? "+" : ""}${d.pos[2]}) m`; if (d.spec_vn) h += `<br><i>${d.spec_vn}</i>`; }
